humanoid:
  model: "unitree_h1"  # or "fourier_gr1", "tesla_optimus"
  dof: 21
  height: 1.8
  mass: 47kg

physics:
  backend: genesis
  dt: 0.002
  substeps: 2
  contact_stiffness: 1e5

domain_randomization:
  friction: [0.2, 1.2]
  mass_scale: [0.8, 1.2]
  com_offset: [-0.05, 0.05]
  push_velocity: [-0.5, 0.5]

render:
  engine: unreal
  usd_path: "/tmp/humanoid_live.usda"
  resolution: [1920, 1080]
  rtx: true
